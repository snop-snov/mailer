[project]
name = "mailer"
version = "0.1.0"
description = "Anonymous Telegram message relay bot with human premoderation"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.7,<4",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.handlers"]
